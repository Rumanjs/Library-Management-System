{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>{{ 'Edit' if book else 'Add' }} Book</h2>
    <form method="POST">
        <div class="form-group">
            <label for="book_id">Book ID:</label>
            <input type="text" id="book_id" name="book_id" class="form-control" value="{{ book.book_id if book else '' }}" {{ 'readonly' if book else '' }} required>
        </div>
        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" class="form-control" value="{{ book.title if book else '' }}" required>
        </div>
        <div class="form-group">
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" class="form-control" value="{{ book.author if book else '' }}" required>
        </div>
        <div class="form-group">
            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn" class="form-control" value="{{ book.isbn if book else '' }}" required>
        </div>
        <div class="form-group">
            <label for="total_copies">Total Copies:</label>
            <input type="number" id="total_copies" name="total_copies" class="form-control" value="{{ book.total_copies if book else '1' }}" min="1" required>
        </div>
        <button type="submit" class="btn">{{ 'Update' if book else 'Add' }} Book</button>
        <a href="{{ url_for('books') }}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
